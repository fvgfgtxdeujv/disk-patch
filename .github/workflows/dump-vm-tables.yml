name: dump-vm-tables

# 在 GitHub 的 Windows runner 上跑 DiskGenius（原版加壳 exe），
# 壳会在运行时把它自己的 .vmp 段解密到内存，我们就读那块内存里的 handler 表。
# 不注入、不调试：只用 ReadProcessMemory + 内存特征扫描。
#
# 安装包来源三级回退：
#   1. 仓库里的 vendor/*.zip（提交进仓库，最省事、最快）
#   2. Actions cache（首次跑完自动存，之后命中）
#   3. 官网下载（最后兜底）
#
# 手动触发：Actions -> dump-vm-tables -> Run workflow
#
# 2026-11 修复：
#   * 全局 UTF-8：runner 控制台默认 cp1252，脚本里的中文 print 会
#     UnicodeEncodeError 把整步打断（v1 就是死在这）
#   * API 触发时 github.event.inputs.* 为空串，不会回落到默认值 —— 这里显式兜底
#   * 目标 exe 是 requireAdministrator，直接 Popen 会 740，脚本内改走 runas
#   * 在线扫不到时把可读内存存成 memimage 再离线扫一遍

on:
  workflow_dispatch:
    inputs:
      pkg_url:
        description: '安装包地址（留空用默认）'
        required: false
        default: ''
      pkg_tag:
        description: '缓存标签（换版本时改一下，避免命中旧缓存）'
        required: false
        default: '6201829'
      seconds:
        description: '轮询秒数'
        required: false
        default: '90'
      min_score:
        description: '上下文候选最低分'
        required: false
        default: '4'

env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: 'utf-8'
  PYTHONUNBUFFERED: '1'

jobs:
  dump:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy

      - name: 本地自检（扫描算法 + 内存镜像，不依赖目标程序）
        shell: pwsh
        run: python winactions/local_selftest.py

      - name: 数值输入兜底（API 触发时 inputs 是空串）
        id: cfg
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.pkg_tag }}"
          if ([string]::IsNullOrWhiteSpace($tag)) { $tag = '6201829' }
          $sec = "${{ github.event.inputs.seconds }}"
          if ([string]::IsNullOrWhiteSpace($sec)) { $sec = '90' }
          $ms  = "${{ github.event.inputs.min_score }}"
          if ([string]::IsNullOrWhiteSpace($ms))  { $ms = '4' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "seconds=$sec" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "min_score=$ms" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "tag=$tag seconds=$sec min_score=$ms"

      # ---------- 安装包：vendor -> cache -> 官网 ----------
      - name: 恢复安装包缓存
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: vendor
          key: dg-pkg-${{ steps.cfg.outputs.tag }}

      - name: 确保有安装包
        id: pkg
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path vendor -Filter *.zip -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($zip) {
            Write-Host "用已有的包: $($zip.FullName)"
            Write-Host ("大小: {0:N0} 字节" -f $zip.Length)
            Write-Host ("SHA256: {0}" -f (Get-FileHash $zip.FullName -Algorithm SHA256).Hash)
            "zip=$($zip.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          $url = "${{ github.event.inputs.pkg_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            $url = "https://www.diskgenius.com/dyna_download/?software=DGEng6201829_x64.zip"
          }
          Write-Host "没有本地包，下载: $url"
          New-Item -ItemType Directory -Force -Path vendor | Out-Null
          $out = "vendor\dg-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $out -UseBasicParsing -TimeoutSec 600
          Write-Host ("下载完成: {0:N0} 字节" -f (Get-Item $out).Length)
          Write-Host ("SHA256: {0}" -f (Get-FileHash $out -Algorithm SHA256).Hash)
          "zip=$((Resolve-Path $out).Path)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 保存安装包缓存
        if: steps.restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: vendor
          key: dg-pkg-${{ steps.cfg.outputs.tag }}

      - name: 解压并定位 exe
        id: dl
        shell: pwsh
        run: |
          $zip = "${{ steps.pkg.outputs.zip }}"
          if ([string]::IsNullOrWhiteSpace($zip)) { throw "没有安装包" }
          if (Test-Path dg) { Remove-Item -Recurse -Force dg }
          Expand-Archive -Path $zip -DestinationPath dg -Force
          $exe = Get-ChildItem -Path dg -Recurse -Filter DiskGenius.exe | Select-Object -First 1
          if (-not $exe) { throw "包里没有 DiskGenius.exe" }
          Write-Host "EXE: $($exe.FullName)"
          Write-Host ("大小: {0:N0} 字节" -f $exe.Length)
          "exe=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # ---------- 抓表 ----------
      - name: 环境诊断
        shell: pwsh
        run: |
          Write-Host "管理员: $(([Security.Principal.WindowsPrincipal] `
            [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole( `
            [Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host "Python: $(python -c 'import sys;print(sys.version)')"
          python -c "import sys;print('stdout encoding:', sys.stdout.encoding)"

      - name: 抓 VM 上下文（在线扫 + 内存镜像兜底）
        id: dump
        shell: pwsh
        continue-on-error: true
        run: |
          $exe = "${{ steps.dl.outputs.exe }}"
          python winactions/dump_ctx.py `
            --exe "$exe" `
            --seconds ${{ steps.cfg.outputs.seconds }} `
            --min-score ${{ steps.cfg.outputs.min_score }} `
            --image dg.memimg `
            --out tables.json 2>&1 | Tee-Object -FilePath dump.log
          Write-Host "退出码: $LASTEXITCODE"

      - name: 没抓到就明确报错（别让 job 绿着交空产物）
        if: ${{ hashFiles('tables.json') == '' }}
        shell: pwsh
        run: |
          Write-Host "=== dump.log 尾部 ==="
          if (Test-Path dump.log) { Get-Content dump.log -Tail 80 }
          if (Test-Path dg.memimg) {
            Write-Host ("memimg 大小: {0:N0}" -f (Get-Item dg.memimg).Length)
          }
          throw "没有拿到 tables.json：目标进程没跑起来 / 上下文没扫到。日志见 artifact。"

      - name: 合并成 handlers.py
        shell: pwsh
        run: |
          python winactions/merge_tables.py tables.json --out handlers.py --json handlers.json 2>&1 |
            Tee-Object -FilePath merge.log

      - name: 产物摘要
        shell: pwsh
        run: |
          python -c "import json;d=json.load(open('tables.json',encoding='utf-8'));t=d.get('tables') or {};print('mode=%s source=%s 表=%d 项=%d'%(d.get('mode'),d.get('source'),len(t),sum(len(v.get('entries') or []) for v in t.values())));print('vmp_rva=%s module_base=%s'%(d.get('vmp_rva'),d.get('module_base')))"

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-tables
          path: |
            tables.json
            handlers.py
            handlers.json
            dump.log
            merge.log
            dg.memimg
          if-no-files-found: warn
          retention-days: 7
